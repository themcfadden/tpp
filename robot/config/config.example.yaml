# Example robot configuration — copy to config.yaml and edit.

http_port: 8080
camera_device: /dev/video0
video_bitrate: 1000000      # 1 Mbps — good for 720p/30fps

# Pololu Maestro USB servo controller
maestro_port: /dev/ttyACM0

# Maestro channel assignments
maestro_pan_channel:   0
maestro_tilt_channel:  1
maestro_laser_channel: 2

# Servo calibration (pulse width in microseconds)
# Adjust these to match your specific servos' travel range
pan_min_us:  992.0
pan_max_us:  2000.0
tilt_min_us: 1000.0
tilt_max_us: 1800.0

# Motor driver: "uart" or "noop" (noop = no hardware, safe for dev)
motor_driver: noop
motor_port:   /dev/ttyUSB0
motor_baud:   115200
